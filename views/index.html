<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ASTRAL MP4 Downloader</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-animation"></div>
    
    <div class="container">
        <h1 class="glitch" data-text="ASTRAL MP4">ASTRAL MP4</h1>
        <p class="subtitle">YouTube // Portal</p>
        
        <div class="input-group">
            <input type="url" id="videoUrl" placeholder="Вставьте ссылку на видео..." autocomplete="off">
            <button id="downloadBtn" class="btn-astral">СКАЧАТЬ</button>
        </div>
        
        <div id="status" class="status-msg"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
